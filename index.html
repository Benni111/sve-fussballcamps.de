/* Layout: Vereinsfarben Blau-Weiß, Trikotstreifen unter dem Kopf, blaues Spielfeld-Band mit Kreidelinien als Hero, Tagesablauf als Spielverlauf */
:root {
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --fg: #0A1A33;
  --muted: #4A5A72;
  --line: #D5DEEB;
  --blue: #0168B2;
  --blue-deep: #01467A;
  --on-blue: #FFFFFF;
  --sky: #A9D1FF;
  --sky-ink: #06224A;
  --focus: #0168B2;
  --danger: #B3261E;
  --ok-bg: #E6EFFB;
  --f-display: "SVE Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "SVE Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-label: "SVE Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071224; --surface: #0D1C35; --fg: #E7EEF8; --muted: #9EB0C9; --line: #1C2F4F;
    --blue: #2E8BD6; --blue-deep: #06305A; --on-blue: #FFFFFF; --sky: #A9D1FF; --sky-ink: #06224A;
    --focus: #A9D1FF; --danger: #F2867E; --ok-bg: #102849;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071224; --surface: #0D1C35; --fg: #E7EEF8; --muted: #9EB0C9; --line: #1C2F4F;
  --blue: #2E8BD6; --blue-deep: #06305A; --on-blue: #FFFFFF; --sky: #A9D1FF; --sky-ink: #06224A;
  --focus: #A9D1FF; --danger: #F2867E; --ok-bg: #102849;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--blue-deep);
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.02; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; text-transform: uppercase; }
h3 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; }
p { margin: 0; }
.label {
  font-family: var(--f-label); font-weight: 600; text-transform: uppercase;
  letter-spacing: .1em; font-size: .82rem; color: var(--muted);
}
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.top :focus-visible, .on-blue :focus-visible { outline-color: #FFFFFF; }

/* Kopf mit Trikotstreifen */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--blue-deep); color: var(--on-blue);
  border-bottom: 4px solid #FFFFFF; box-shadow: 0 4px 0 var(--blue);
}
.top .wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand img { height: 54px; width: auto; display: block; }
.brand .words { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; letter-spacing: .02em; color: #FFFFFF; }
.brand span { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; color: var(--sky); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: transparent; color: var(--on-blue);
  font-family: var(--f-label); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em;
  padding: 8px 14px; border-radius: var(--radius); cursor: pointer; white-space: nowrap; opacity: .85;
}
.tab:hover { opacity: 1; background: rgba(255,255,255,.1); }
.tab[aria-selected="true"] { opacity: 1; background: #FFFFFF; color: #01467A; }
.tab.cta:not([aria-selected="true"]) { box-shadow: inset 0 0 0 2px #FFFFFF; }

main { padding-bottom: 64px; }
section.panel { display: grid; gap: 48px; }
section.panel > .wrap { width: 100%; }

/* Hero */
.hero { background: var(--blue); color: var(--on-blue); position: relative; overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 80px, rgba(255,255,255,.05) 80px 160px);
}
.hero svg.lines { position: absolute; right: -120px; top: 50%; transform: translateY(-50%); width: 560px; height: auto; pointer-events: none; }
.hero .wrap { position: relative; display: grid; gap: 28px; padding-block: 56px 48px; }
.hero-text { display: grid; gap: 28px; min-width: 0; }
.hero h1 { font-size: clamp(3rem, 10vw, 6.4rem); font-weight: 900; text-transform: uppercase; max-width: 11ch; }
.hero h1 em { font-style: normal; color: var(--sky); }
.hero .label { color: var(--sky); }
.hero p.lead { font-size: 1.2rem; max-width: 46ch; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  font-family: var(--f-label); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem;
  padding: 6px 12px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.4); background: rgba(255,255,255,.08);
}
.btn {
  appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--f-label); font-weight: 700; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em;
  padding: 12px 22px; border-radius: var(--radius); background: var(--blue); color: var(--on-blue); text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.on-blue .btn { background: #FFFFFF; color: #01467A; }
.btn.ghost, .on-blue .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Anzeigetafel nächstes Camp */
.board {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 24px; align-items: center;
  background: #022544; color: #F2F6FC; border-radius: var(--radius); padding: 18px 22px; max-width: 560px;
  border: 1px solid rgba(255,255,255,.18);
}
.board .num { grid-row: span 2; font-family: var(--f-display); font-weight: 900; font-size: 4.2rem; line-height: .9; color: #A9D1FF; font-variant-numeric: tabular-nums; }
.board .num small { display: block; font-family: var(--f-label); font-size: .85rem; letter-spacing: .1em; color: #B7C6DC; text-transform: uppercase; font-weight: 600; }
.board .what { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; }
.board .when { font-family: var(--f-label); font-size: 1.1rem; letter-spacing: .04em; color: #CCD8EA; }

/* Inhalte */
.intro { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; padding-top: 56px; }
.intro > * { min-width: 0; }
.stack { display: grid; gap: 14px; align-content: start; }
.inclusive { list-style: none; margin: 0; padding: 0; display: grid; border-top: 2px solid var(--fg); }
.inclusive li { display: grid; grid-template-columns: 2.2rem 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.inclusive li svg { width: 26px; height: 26px; color: var(--blue); margin-top: 2px; }
.inclusive strong { display: block; font-weight: 600; }
.inclusive span { color: var(--muted); font-size: .95rem; }

.place { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.place > div { padding: 24px; min-width: 0; }
.place .mini { background: var(--blue); padding: 0; display: grid; place-items: center; min-height: 200px; }
.place .mini svg { width: 82%; height: auto; }
.place address { font-style: normal; font-size: 1.15rem; display: grid; }
.muted { color: var(--muted); }

/* Termine */
.head { display: grid; gap: 10px; padding-top: 48px; }
.head > * { max-width: 62ch; }
.head p { color: var(--muted); }
.camps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; }
.camp {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
}
.camp .season { background: var(--blue-deep); color: var(--on-blue); padding: 16px 20px; display: grid; gap: 2px; border-bottom: 4px solid var(--blue); }
.camp .season .label { color: var(--sky); }
.camp .season h3 { font-size: 2rem; }
.camp .body { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.camp dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
.camp dt { font-family: var(--f-label); text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; color: var(--muted); padding-top: 2px; }
.camp dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.camp .note { font-size: .9rem; color: var(--muted); }
.camp .foot { padding: 0 20px 20px; }

  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }

        <span class="label" data-t="intro-label">Über die Camps</span>
        <h2 data-t="intro-h2">Eine Woche wie ein Turnier­tag nach dem anderen</h2>
        <p data-t="intro-p1">Die SVE Fußballcamps werden von der Germania 1911 Eberstadt veranstaltet. Das Trainerteam des Vereins gibt seine Begeisterung für Fußball an Kinder ab 5 Jahren weiter: an Mädchen und Jungen, an Anfänger und Vereinsspieler.</p>
        <p data-t="intro-p2">Vormittags wird trainiert und bei Challenges um Punkte gespielt, nach dem Mittagessen geht es ins Turnier. Im Oster- und im Sommercamp gibt es zusätzlich einen Ausflugstag.</p>

      <p data-t="abl-p">Jeder Camptag folgt dem gleichen Spielplan. Zwischendurch gibt es immer Wasser, Apfelschorle und gesunde Snacks.</p>

        <p data-t="ds-1">Verantwortlich für die Datenverarbeitung auf dieser Webseite ist der im Impressum genannte Verein. Bei Fragen zum Datenschutz erreicht ihr uns unter jugendleitung@germania-eberstadt.de.</p>

      <section>
        <h3>2. Hosting</h3>
        <p data-t="ds-2">Diese Webseite wird über GitHub Pages der GitHub, Inc. (USA) bereitgestellt. Beim Aufruf der Seite verarbeitet der Hoster technisch notwendige Daten wie IP-Adresse, Datum und Uhrzeit des Abrufs und Browsertyp, um die Seite auszuliefern und vor Missbrauch zu schützen. Rechtsgrundlage ist unser berechtigtes Interesse an einem sicheren und stabilen Betrieb der Webseite (Art. 6 Abs. 1 lit. f DSGVO). Dabei können Daten in die USA übermittelt werden.</p>

      <section>
        <h3>3. Anmeldung zum Camp</h3>
        <p data-t="ds-3a">Wenn ihr euer Kind anmeldet, verarbeiten wir die Angaben aus dem Formular: Name und Geburtsdatum des Kindes, Verein, Hinweise zu Allergien und Unverträglichkeiten, ÖPNV-Ticket, Name, E-Mail-Adresse und Telefonnummer der Erziehungsberechtigten, einen optionalen Notfallkontakt und eure Anmerkungen.</p>
        <p data-t="ds-3b">Wir nutzen die Daten, um das Camp zu organisieren und durchzuführen, euch zu kontaktieren und die Zahlung zuzuordnen. Rechtsgrundlage ist die Durchführung der Anmeldung (Art. 6 Abs. 1 lit. b DSGVO). Angaben zu Allergien und Unverträglichkeiten sind Gesundheitsdaten. Diese verarbeiten wir nur mit eurer ausdrücklichen Einwilligung (Art. 9 Abs. 2 lit. a DSGVO), die ihr jederzeit per E-Mail widerrufen könnt.</p>
        <p data-t="ds-3c">Die Formulardaten werden über den Dienst Web3Forms (web3forms.com) per E-Mail an die Jugendleitung übermittelt. Wir löschen die Daten, sobald sie für Durchführung und Abrechnung des Camps nicht mehr benötigt werden, soweit keine gesetzlichen Aufbewahrungspflichten bestehen.</p>
      </section>
      <section>
        <h3>4. Feedback</h3>
        <p data-t="ds-4">Feedback könnt ihr anonym abgeben. Wenn ihr freiwillig Name oder E-Mail-Adresse angebt, nutzen wir diese nur, um euch zu antworten (Art. 6 Abs. 1 lit. a DSGVO). Auch das Feedback wird über Web3Forms per E-Mail an die Jugendleitung übermittelt.</p>
      </section>
      <section>
        <h3>5. Schriften, Cookies und Tracking</h3>
        <p data-t="ds-5">Die Schriften sind direkt in die Seite eingebunden, es wird dafür keine Verbindung zu Google oder anderen Anbietern aufgebaut. Diese Webseite setzt keine Cookies und verwendet keine Analyse- oder Tracking-Dienste.</p>
      </section>

        <p data-t="ds-6b">Außerdem könnt ihr euch bei einer Datenschutz-Aufsichtsbehörde beschweren, in Hessen beim Hessischen Beauftragten für Datenschutz und Informationsfreiheit.</p>

      '<div id="app"></div>',
      '<script type="application/json" id="state">' + json + '<\/script>',
      document.getElementById("main-js").outerHTML
    ];
    return SKEL + "\n" + parts.join("\n") + "\n</body></html>";
  }

  function collect() {
    const ns = JSON.parse(JSON.stringify(state));
    app.querySelectorAll("[data-t]").forEach(n => {
      const k = n.dataset.t, v = norm(n.textContent);
      if (v && v !== DEFAULTS[k]) ns.texts[k] = v; else delete ns.texts[k];
    });
    app.querySelectorAll("[data-c]").forEach(n => {
      const [i, f] = n.dataset.c.split(".");
      if (ns.camps[+i]) ns.camps[+i][f] = norm(n.textContent);
    });
    return ns;
  }

  async function setupEditing() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    let artifact = null, user = null;
    try { [artifact, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]); } catch (e) { return; }
    if (!artifact || !user) return;
    let can = false;
    try { can = await user.canEdit(); } catch (e) {}
    if (!can) return;

    const fab = el("button", "btn edit-fab", "Texte bearbeiten"); fab.type = "button";
    const bar = el("div", "editbar"); bar.hidden = true;
    const wrap = el("div", "wrap");
    const msg = el("div", "msg");
    msg.append(el("strong", null, "Bearbeitungsmodus"), el("span", null, "Klickt auf einen umrandeten Text und schreibt einfach los. Gespeichert wird für alle."));
    const cancel = el("button", "btn ghost", "Abbrechen"); cancel.type = "button";
    const save = el("button", "btn", "Speichern"); save.type = "button";
    wrap.append(msg, cancel, save); bar.append(wrap);
    document.body.append(fab, bar);

    const setMode = on => { editing = on; fab.hidden = on; bar.hidden = !on; render(); };
    fab.addEventListener("click", () => setMode(true));
    cancel.addEventListener("click", () => setMode(false));
    save.addEventListener("click", async () => {
      const ns = collect();
      if (JSON.stringify(ns) === JSON.stringify(state)) { setMode(false); toast("Keine Änderungen zum Speichern."); return; }
      save.disabled = true; save.textContent = "Speichert …";
      try {
        await artifact.publish(buildDoc(ns));
        state = ns; // die Seite lädt gleich mit der neuen Version neu
      } catch (err) {
        save.disabled = false; save.textContent = "Speichern";
        const code = err && err.code;
        if (code === "conflict") toast("Jemand anderes hat gerade gespeichert. Die Seite lädt neu, bitte macht eure Änderung danach noch einmal.");
        else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared") {
          setMode(false); fab.remove(); bar.remove(); toast("Du hast für diese Seite keine Bearbeitungsrechte.");
        }
        else if (code === "rate_limited") toast("Gerade wurde zu oft gespeichert. Bitte in einer Minute noch einmal versuchen.");
        else toast("Speichern hat nicht geklappt. Bitte gleich noch einmal versuchen.");
      }
    });
  }
  setupEditing();
})();
</script>

</body>
</html>
